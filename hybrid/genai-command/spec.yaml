---
host: "lightapi.net"
service: "genai"
schemas:
  # Workflow Definition
  createWfDefinitionRequest:
    title: "Workflow Definition"
    type: "object"
    properties:
      hostId: { type: "string" }
      wfDefId: { type: "string" }
      namespace: { type: "string" }
      name: { type: "string" }
      version: { type: "string" }
      definition: { type: "string" }
    required: ["hostId", "wfDefId", "namespace", "name", "version", "definition"]
  updateWfDefinitionRequest:
    title: "Workflow Definition"
    type: "object"
    properties:
      hostId: { type: "string" }
      wfDefId: { type: "string" }
      namespace: { type: "string" }
      name: { type: "string" }
      version: { type: "string" }
      definition: { type: "string" }
      active: { type: "boolean" }
    required: ["hostId", "wfDefId"]
  deleteWfDefinitionRequest:
    title: "Workflow Definition"
    type: "object"
    properties:
      hostId: { type: "string" }
      wfDefId: { type: "string" }
    required: ["hostId", "wfDefId"]

  # Worklist
  createWorklistRequest:
    title: "Worklist"
    type: "object"
    properties:
      hostId: { type: "string" }
      assigneeId: { type: "string" }
      categoryId: { type: "string" }
      statusCode: { type: "string" }
      appId: { type: "string" }
    required: ["hostId", "assigneeId", "categoryId"]
  updateWorklistRequest:
    title: "Worklist"
    type: "object"
    properties:
      hostId: { type: "string" }
      assigneeId: { type: "string" }
      categoryId: { type: "string" }
      statusCode: { type: "string" }
      appId: { type: "string" }
      active: { type: "boolean" }
    required: ["hostId", "assigneeId", "categoryId"]
  deleteWorklistRequest:
    title: "Worklist"
    type: "object"
    properties:
      hostId: { type: "string" }
      assigneeId: { type: "string" }
      categoryId: { type: "string" }
    required: ["hostId", "assigneeId", "categoryId"]

  # Worklist Column
  createWorklistColumnRequest:
    title: "Worklist Column"
    type: "object"
    properties:
      hostId: { type: "string" }
      assigneeId: { type: "string" }
      categoryId: { type: "string" }
      sequenceId: { type: "integer" }
      columnId: { type: "string" }
    required: ["hostId", "assigneeId", "categoryId", "sequenceId", "columnId"]
  updateWorklistColumnRequest:
    title: "Worklist Column"
    type: "object"
    properties:
      hostId: { type: "string" }
      assigneeId: { type: "string" }
      categoryId: { type: "string" }
      sequenceId: { type: "integer" }
      columnId: { type: "string" }
      active: { type: "boolean" }
    required: ["hostId", "assigneeId", "categoryId", "sequenceId"]
  deleteWorklistColumnRequest:
    title: "Worklist Column"
    type: "object"
    properties:
      hostId: { type: "string" }
      assigneeId: { type: "string" }
      categoryId: { type: "string" }
      sequenceId: { type: "integer" }
    required: ["hostId", "assigneeId", "categoryId", "sequenceId"]

  # Process Info
  createProcessInfoRequest:
    title: "Process Info"
    type: "object"
    properties:
      hostId: { type: "string" }
      processId: { type: "string" }
      wfDefId: { type: "string" }
      wfInstanceId: { type: "string" }
      appId: { type: "string" }
      processType: { type: "string" }
      statusCode: { type: "string" }
      exTriggerTs: { type: "string", format: "date-time" }
      customStatusCode: { type: "string" }
      sourceId: { type: "string" }
      branchCode: { type: "string" }
      rrCode: { type: "string" }
      partyId: { type: "string" }
      partyName: { type: "string" }
      counterPartyId: { type: "string" }
      counterPartyName: { type: "string" }
      txnId: { type: "string" }
      txnName: { type: "string" }
      productId: { type: "string" }
      productName: { type: "string" }
      productType: { type: "string" }
      groupName: { type: "string" }
      subgroupName: { type: "string" }
      eventStartTs: { type: "string", format: "date-time" }
      eventEndTs: { type: "string", format: "date-time" }
      eventOtherTs: { type: "string", format: "date-time" }
      eventOther: { type: "string" }
      risk: { type: "number" }
      riskScale: { type: "integer" }
      price: { type: "number" }
      priceScale: { type: "integer" }
      productQy: { type: "number" }
      currencyCode: { type: "string" }
      exRefId: { type: "string" }
      exRefCode: { type: "string" }
      productQyScale: { type: "integer" }
      parentProcessId: { type: "string" }
      deadlineTs: { type: "string", format: "date-time" }
      parentGroupId: { type: "number" }
      processSubtypeCode: { type: "string" }
      owningGroupName: { type: "string" }
    required: ["hostId", "processId", "wfDefId", "wfInstanceId", "appId", "processType", "statusCode", "exTriggerTs"]
  updateProcessInfoRequest:
    title: "Process Info"
    type: "object"
    properties:
      hostId: { type: "string" }
      processId: { type: "string" }
      statusCode: { type: "string" }
      customStatusCode: { type: "string" }
      completedTs: { type: "string", format: "date-time" }
      resultCode: { type: "string" }
      active: { type: "boolean" }
    required: ["hostId", "processId"]
  deleteProcessInfoRequest:
    title: "Process Info"
    type: "object"
    properties:
      hostId: { type: "string" }
      processId: { type: "string" }
    required: ["hostId", "processId"]

  # Agent Definition
  createAgentDefinitionRequest:
    title: "Agent Definition"
    type: "object"
    properties:
      hostId: { type: "string" }
      agentDefId: { type: "string" }
      agentName: { type: "string" }
      modelProvider: { type: "string" }
      modelName: { type: "string" }
      apiKeyRef: { type: "string" }
      temperature: { type: "number" }
      maxTokens: { type: "integer" }
    required: ["hostId", "agentDefId", "agentName", "modelProvider", "modelName"]
  updateAgentDefinitionRequest:
    title: "Agent Definition"
    type: "object"
    properties:
      hostId: { type: "string" }
      agentDefId: { type: "string" }
      agentName: { type: "string" }
      modelProvider: { type: "string" }
      modelName: { type: "string" }
      apiKeyRef: { type: "string" }
      temperature: { type: "number" }
      maxTokens: { type: "integer" }
      active: { type: "boolean" }
    required: ["hostId", "agentDefId"]
  deleteAgentDefinitionRequest:
    title: "Agent Definition"
    type: "object"
    properties:
      hostId: { type: "string" }
      agentDefId: { type: "string" }
    required: ["hostId", "agentDefId"]

  # Task Info
  createTaskInfoRequest:
    title: "Task Info"
    type: "object"
    properties:
      hostId: { type: "string" }
      taskId: { type: "string" }
      agentDefId: { type: "string" }
      taskType: { type: "string" }
      processId: { type: "string" }
      wfInstanceId: { type: "string" }
      wfTaskId: { type: "string" }
      statusCode: { type: "string" }
      locked: { type: "string" }
      priority: { type: "integer" }
      deadlineTs: { type: "string", format: "date-time" }
    required: ["hostId", "taskId", "agentDefId", "taskType", "processId", "wfInstanceId", "wfTaskId", "statusCode", "locked", "priority"]
  updateTaskInfoRequest:
    title: "Task Info"
    type: "object"
    properties:
      hostId: { type: "string" }
      taskId: { type: "string" }
      statusCode: { type: "string" }
      completedTs: { type: "string", format: "date-time" }
      completedUser: { type: "string" }
      resultCode: { type: "string" }
      lockingUser: { type: "string" }
      lockingRole: { type: "string" }
      lockGroup: { type: "string" }
      active: { type: "boolean" }
    required: ["hostId", "taskId"]
  deleteTaskInfoRequest:
    title: "Task Info"
    type: "object"
    properties:
      hostId: { type: "string" }
      taskId: { type: "string" }
    required: ["hostId", "taskId"]

  # Task Asst
  createTaskAsstRequest:
    title: "Task Assistant"
    type: "object"
    properties:
      hostId: { type: "string" }
      taskAsstId: { type: "string" }
      taskId: { type: "string" }
      assigneeId: { type: "string" }
      reasonCode: { type: "string" }
      categoryCode: { type: "string" }
    required: ["hostId", "taskAsstId", "taskId", "assigneeId", "reasonCode"]
  updateTaskAsstRequest:
    title: "Task Assistant"
    type: "object"
    properties:
      hostId: { type: "string" }
      taskAsstId: { type: "string" }
      unassignedTs: { type: "string", format: "date-time" }
      unassignedReason: { type: "string" }
      active: { type: "boolean" }
    required: ["hostId", "taskAsstId"]
  deleteTaskAsstRequest:
    title: "Task Assistant"
    type: "object"
    properties:
      hostId: { type: "string" }
      taskAsstId: { type: "string" }
    required: ["hostId", "taskAsstId"]

  # Audit Log
  createAuditLogRequest:
    title: "Audit Log"
    type: "object"
    properties:
      hostId: { type: "string" }
      auditLogId: { type: "string" }
      sourceTypeId: { type: "string" }
      correlationId: { type: "string" }
      userId: { type: "string" }
      success: { type: "string" }
      message0: { type: "string" }
      message1: { type: "string" }
      message2: { type: "string" }
      message3: { type: "string" }
      message: { type: "string" }
      userComment: { type: "string" }
    required: ["hostId", "auditLogId"]

  # Skill
  createSkillRequest:
    title: "Skill"
    type: "object"
    properties:
      hostId: { type: "string" }
      skillId: { type: "string" }
      parentSkillId: { type: "string" }
      name: { type: "string" }
      description: { type: "string" }
      contentMarkdown: { type: "string" }
      implementationType: { type: "string" }
      implementationClass: { type: "string" }
      scriptContent: { type: "string" }
      apiEndpoint: { type: "string" }
      apiMethod: { type: "string" }
      author: { type: "string" }
      version: { type: "string" }
    required: ["hostId", "skillId", "name", "contentMarkdown", "implementationClass"]
  updateSkillRequest:
    title: "Skill"
    type: "object"
    properties:
      hostId: { type: "string" }
      skillId: { type: "string" }
      parentSkillId: { type: "string" }
      name: { type: "string" }
      description: { type: "string" }
      contentMarkdown: { type: "string" }
      implementationType: { type: "string" }
      implementationClass: { type: "string" }
      scriptContent: { type: "string" }
      apiEndpoint: { type: "string" }
      apiMethod: { type: "string" }
      author: { type: "string" }
      version: { type: "string" }
      active: { type: "boolean" }
    required: ["hostId", "skillId"]
  deleteSkillRequest:
    title: "Skill"
    type: "object"
    properties:
      hostId: { type: "string" }
      skillId: { type: "string" }
    required: ["hostId", "skillId"]

  # Skill Param
  createSkillParamRequest:
    title: "Skill Parameter"
    type: "object"
    properties:
      hostId: { type: "string" }
      paramId: { type: "string" }
      skillId: { type: "string" }
      name: { type: "string" }
      paramType: { type: "string" }
      required: { type: "boolean" }
      defaultValue: { type: "object" }
      description: { type: "string" }
      validationSchema: { type: "object" }
      orderIndex: { type: "integer" }
    required: ["hostId", "paramId", "skillId", "name", "paramType"]
  updateSkillParamRequest:
    title: "Skill Parameter"
    type: "object"
    properties:
      hostId: { type: "string" }
      paramId: { type: "string" }
      name: { type: "string" }
      paramType: { type: "string" }
      required: { type: "boolean" }
      defaultValue: { type: "object" }
      description: { type: "string" }
      validationSchema: { type: "object" }
      orderIndex: { type: "integer" }
      active: { type: "boolean" }
    required: ["hostId", "paramId"]
  deleteSkillParamRequest:
    title: "Skill Parameter"
    type: "object"
    properties:
      hostId: { type: "string" }
      paramId: { type: "string" }
    required: ["hostId", "paramId"]

  # Skill Dependency
  createSkillDependencyRequest:
    title: "Skill Dependency"
    type: "object"
    properties:
      hostId: { type: "string" }
      skillId: { type: "string" }
      dependsOnSkillId: { type: "string" }
      required: { type: "boolean" }
    required: ["hostId", "skillId", "dependsOnSkillId"]
  updateSkillDependencyRequest:
    title: "Skill Dependency"
    type: "object"
    properties:
      hostId: { type: "string" }
      skillId: { type: "string" }
      dependsOnSkillId: { type: "string" }
      required: { type: "boolean" }
      active: { type: "boolean" }
    required: ["hostId", "skillId", "dependsOnSkillId"]
  deleteSkillDependencyRequest:
    title: "Skill Dependency"
    type: "object"
    properties:
      hostId: { type: "string" }
      skillId: { type: "string" }
      dependsOnSkillId: { type: "string" }
    required: ["hostId", "skillId", "dependsOnSkillId"]

  # Agent Skill
  createAgentSkillRequest:
    title: "Agent Skill"
    type: "object"
    properties:
      hostId: { type: "string" }
      agentDefId: { type: "string" }
      skillId: { type: "string" }
      config: { type: "object" }
      priority: { type: "integer" }
      timeoutSeconds: { type: "integer" }
      maxRetries: { type: "integer" }
      sequenceId: { type: "integer" }
    required: ["hostId", "agentDefId", "skillId"]
  updateAgentSkillRequest:
    title: "Agent Skill"
    type: "object"
    properties:
      hostId: { type: "string" }
      agentDefId: { type: "string" }
      skillId: { type: "string" }
      config: { type: "object" }
      priority: { type: "integer" }
      timeoutSeconds: { type: "integer" }
      maxRetries: { type: "integer" }
      sequenceId: { type: "integer" }
      active: { type: "boolean" }
    required: ["hostId", "agentDefId", "skillId"]
  deleteAgentSkillRequest:
    title: "Agent Skill"
    type: "object"
    properties:
      hostId: { type: "string" }
      agentDefId: { type: "string" }
      skillId: { type: "string" }
    required: ["hostId", "agentDefId", "skillId"]

  # Agent Session History
  createAgentSessionHistoryRequest:
    title: "Agent Session History"
    type: "object"
    properties:
      hostId: { type: "string" }
      sessionHistoryId: { type: "string" }
      processId: { type: "string" }
      taskId: { type: "string" }
      role: { type: "string" }
      content: { type: "string" }
      toolCallId: { type: "string" }
    required: ["hostId", "sessionHistoryId", "processId", "role", "content"]
  deleteAgentSessionHistoryRequest:
    title: "Agent Session History"
    type: "object"
    properties:
      hostId: { type: "string" }
      sessionHistoryId: { type: "string" }
    required: ["hostId", "sessionHistoryId"]

  # Session Memory
  createSessionMemoryRequest:
    title: "Session Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
      sessionId: { type: "string" }
      agentDefId: { type: "string" }
      userId: { type: "string" }
      content: { type: "string" }
      embedding: { type: "array", items: { type: "number" } }
      importanceScore: { type: "number" }
      expiresAt: { type: "string", format: "date-time" }
      metadata: { type: "object" }
    required: ["hostId", "memId", "sessionId", "agentDefId", "content"]
  updateSessionMemoryRequest:
    title: "Session Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
      content: { type: "string" }
      embedding: { type: "array", items: { type: "number" } }
      importanceScore: { type: "number" }
      expiresAt: { type: "string", format: "date-time" }
      metadata: { type: "object" }
      active: { type: "boolean" }
    required: ["hostId", "memId"]
  deleteSessionMemoryRequest:
    title: "Session Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
    required: ["hostId", "memId"]

  # User Memory
  createUserMemoryRequest:
    title: "User Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
      userId: { type: "string" }
      agentDefId: { type: "string" }
      content: { type: "string" }
      embedding: { type: "array", items: { type: "number" } }
      memoryType: { type: "string" }
      importanceScore: { type: "number" }
      metadata: { type: "object" }
    required: ["hostId", "memId", "userId", "content"]
  updateUserMemoryRequest:
    title: "User Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
      content: { type: "string" }
      embedding: { type: "array", items: { type: "number" } }
      memoryType: { type: "string" }
      importanceScore: { type: "number" }
      accessCount: { type: "integer" }
      lastAccessed: { type: "string", format: "date-time" }
      metadata: { type: "object" }
      active: { type: "boolean" }
    required: ["hostId", "memId"]
  deleteUserMemoryRequest:
    title: "User Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
    required: ["hostId", "memId"]

  # Agent Memory
  createAgentMemoryRequest:
    title: "Agent Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
      agentDefId: { type: "string" }
      content: { type: "string" }
      embedding: { type: "array", items: { type: "number" } }
      memoryType: { type: "string" }
      metadata: { type: "object" }
    required: ["hostId", "memId", "agentDefId", "content"]
  updateAgentMemoryRequest:
    title: "Agent Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
      content: { type: "string" }
      embedding: { type: "array", items: { type: "number" } }
      memoryType: { type: "string" }
      metadata: { type: "object" }
      active: { type: "boolean" }
    required: ["hostId", "memId"]
  deleteAgentMemoryRequest:
    title: "Agent Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
    required: ["hostId", "memId"]

  # Org Memory
  createOrgMemoryRequest:
    title: "Org Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
      domain: { type: "string" }
      source: { type: "string" }
      content: { type: "string" }
      embedding: { type: "array", items: { type: "number" } }
      chunkIndex: { type: "integer" }
      documentId: { type: "string" }
      metadata: { type: "object" }
    required: ["hostId", "memId", "domain", "content"]
  updateOrgMemoryRequest:
    title: "Org Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
      domain: { type: "string" }
      source: { type: "string" }
      content: { type: "string" }
      embedding: { type: "array", items: { type: "number" } }
      chunkIndex: { type: "integer" }
      documentId: { type: "string" }
      metadata: { type: "object" }
      active: { type: "boolean" }
    required: ["hostId", "memId"]
  deleteOrgMemoryRequest:
    title: "Org Memory"
    type: "object"
    properties:
      hostId: { type: "string" }
      memId: { type: "string" }
    required: ["hostId", "memId"]

action:
  - name: "createWfDefinition"
    version: "0.1.0"
    handler: "CreateWfDefinition"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/createWfDefinitionRequest" } }
  - name: "updateWfDefinition"
    version: "0.1.0"
    handler: "UpdateWfDefinition"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/updateWfDefinitionRequest" } }
  - name: "deleteWfDefinition"
    version: "0.1.0"
    handler: "DeleteWfDefinition"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/deleteWfDefinitionRequest" } }

  - name: "createWorklist"
    version: "0.1.0"
    handler: "CreateWorklist"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/createWorklistRequest" } }
  - name: "updateWorklist"
    version: "0.1.0"
    handler: "UpdateWorklist"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/updateWorklistRequest" } }
  - name: "deleteWorklist"
    version: "0.1.0"
    handler: "DeleteWorklist"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/deleteWorklistRequest" } }

  - name: "createWorklistColumn"
    version: "0.1.0"
    handler: "CreateWorklistColumn"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/createWorklistColumnRequest" } }
  - name: "updateWorklistColumn"
    version: "0.1.0"
    handler: "UpdateWorklistColumn"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/updateWorklistColumnRequest" } }
  - name: "deleteWorklistColumn"
    version: "0.1.0"
    handler: "DeleteWorklistColumn"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/deleteWorklistColumnRequest" } }

  - name: "createProcessInfo"
    version: "0.1.0"
    handler: "CreateProcessInfo"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/createProcessInfoRequest" } }
  - name: "updateProcessInfo"
    version: "0.1.0"
    handler: "UpdateProcessInfo"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/updateProcessInfoRequest" } }
  - name: "deleteProcessInfo"
    version: "0.1.0"
    handler: "DeleteProcessInfo"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/deleteProcessInfoRequest" } }

  - name: "createAgentDefinition"
    version: "0.1.0"
    handler: "CreateAgentDefinition"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/createAgentDefinitionRequest" } }
  - name: "updateAgentDefinition"
    version: "0.1.0"
    handler: "UpdateAgentDefinition"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/updateAgentDefinitionRequest" } }
  - name: "deleteAgentDefinition"
    version: "0.1.0"
    handler: "DeleteAgentDefinition"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/deleteAgentDefinitionRequest" } }

  - name: "createTaskInfo"
    version: "0.1.0"
    handler: "CreateTaskInfo"
    scope: "portal.w"
    request: { schema: { $ref: "#/schemas/createTaskInfoRequest" } }
  - name: "updateTaskInfo"
    version: "0.1.0"
    handler: "UpdateTaskInfo"
    scope: "portal.w"
