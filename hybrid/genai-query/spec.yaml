---
host: "lightapi.net"
service: "genai"
schemas:
  # Base Query Request
  baseQueryRequest:
    type: "object"
    properties:
      offset: { type: "integer", description: "Offset" }
      limit: { type: "integer", description: "Limit" }
      hostId: { type: "string", description: "Host Id" }
      filters: { type: "string", description: "Filters" }
      globalFilter: { type: "string", description: "Global Filter" }
      sorting: { type: "string", description: "Sorting" }
      active: { type: "boolean", description: "Active" }
    required: ["offset", "limit", "active", "hostId"]

  # Base Fresh Request
  baseFreshRequest:
    type: "object"
    properties:
      hostId: { type: "string", description: "Host Id" }
      aggregateVersion: { type: "integer", description: "Aggregate Version" }
    required: ["hostId", "aggregateVersion"]

  # Workflow Definition
  getWfDefinitionRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshWfDefinitionRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          wfDefId: { type: "string" }
        required: ["wfDefId"]
  getWfDefinitionLabelRequest:
    type: "object"
    properties:
      hostId: { type: "string" }
    required: ["hostId"]

  # Worklist
  getWorklistRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshWorklistRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          assigneeId: { type: "string" }
          categoryId: { type: "string" }
        required: ["assigneeId", "categoryId"]
  getWorklistLabelRequest:
    type: "object"
    properties:
      hostId: { type: "string" }
    required: ["hostId"]

  # Worklist Column
  getWorklistColumnRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshWorklistColumnRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          assigneeId: { type: "string" }
          categoryId: { type: "string" }
          sequenceId: { type: "integer" }
        required: ["assigneeId", "categoryId", "sequenceId"]

  # Process Info
  getProcessInfoRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshProcessInfoRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          processId: { type: "string" }
        required: ["processId"]
  getProcessInfoLabelRequest:
    type: "object"
    properties:
      hostId: { type: "string" }
    required: ["hostId"]

  # Agent Definition
  getAgentDefinitionRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshAgentDefinitionRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          agentDefId: { type: "string" }
        required: ["agentDefId"]
  getAgentDefinitionLabelRequest:
    type: "object"
    properties:
      hostId: { type: "string" }
    required: ["hostId"]

  # Task Info
  getTaskInfoRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshTaskInfoRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          taskId: { type: "string" }
        required: ["taskId"]
  getTaskInfoLabelRequest:
    type: "object"
    properties:
      hostId: { type: "string" }
    required: ["hostId"]

  # Task Asst
  getTaskAsstRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshTaskAsstRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          taskAsstId: { type: "string" }
        required: ["taskAsstId"]

  # Audit Log
  getAuditLogRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
    required: ["offset", "limit", "hostId"] # active might not apply to audit logs

  # Skill
  getSkillRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshSkillRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          skillId: { type: "string" }
        required: ["skillId"]
  getSkillLabelRequest:
    type: "object"
    properties:
      hostId: { type: "string" }
    required: ["hostId"]

  # Skill Param
  getSkillParamRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshSkillParamRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          paramId: { type: "string" }
        required: ["paramId"]

  # Skill Dependency
  getSkillDependencyRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshSkillDependencyRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          skillId: { type: "string" }
          dependsOnSkillId: { type: "string" }
        required: ["skillId", "dependsOnSkillId"]

  # Agent Skill
  getAgentSkillRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshAgentSkillRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          agentDefId: { type: "string" }
          skillId: { type: "string" }
        required: ["agentDefId", "skillId"]

  # Agent Session History
  getAgentSessionHistoryRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
      - type: "object"
        properties:
          processId: { type: "string" }
        required: ["processId"]

  # Session Memory
  getSessionMemoryRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshSessionMemoryRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          memId: { type: "string" }
        required: ["memId"]

  # User Memory
  getUserMemoryRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshUserMemoryRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          memId: { type: "string" }
        required: ["memId"]

  # Agent Memory
  getAgentMemoryRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshAgentMemoryRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          memId: { type: "string" }
        required: ["memId"]

  # Org Memory
  getOrgMemoryRequest:
    allOf:
      - $ref: "#/schemas/baseQueryRequest"
  getFreshOrgMemoryRequest:
    allOf:
      - $ref: "#/schemas/baseFreshRequest"
      - type: "object"
        properties:
          memId: { type: "string" }
        required: ["memId"]

action:
  - name: "getWfDefinition"
    version: "0.1.0"
    handler: "GetWfDefinition"
    scope: "portal.r"
