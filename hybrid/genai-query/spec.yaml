    - "hostId"
    - "aggregateVersion"
  getWfDefinitionRequest:
    allOf:
    - $ref: "#/schemas/baseQueryRequest"
  getFreshWfDefinitionRequest:
    allOf:
    - $ref: "#/schemas/baseFreshRequest"
