    type: "object"
    properties:
      offset:
        type: "integer"
        description: "Offset"
      limit:
        type: "integer"
        description: "Limit"
      hostId:
        type: "string"
        description: "Host Id"
      filters:
        type: "string"
        description: "Filters"
      globalFilter:
        type: "string"
        description: "Global Filter"
      sorting:
        type: "string"
        description: "Sorting"
      active:
        type: "boolean"
        description: "Active"
    required:
    - "offset"
    - "limit"
    - "active"
    - "hostId"
  baseFreshRequest:
    type: "object"
