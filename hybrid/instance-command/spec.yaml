      serviceId:
        title: "Service Id"
        type: "string"
      current:
        title: "Current"
        type: "boolean"
      readonly:
        title: "Readonly"
        type: "boolean"
      environment:
        title: "Environment"
        type: "string"
      serviceDesc:
        title: "Service Desc"
        type: "string"
      instanceDesc:
        title: "Instance Desc"
        type: "string"
      zone:
        title: "Zone"
        type: "string"
      region:
        title: "Region"
        type: "string"
      lob:
        title: "Lob"
        type: "string"
      resourceName:
        title: "Resource Name"
